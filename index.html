<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>yuro</title>
  <link rel="icon" href="/home/rdx/Desktop/xtra/Wallpapers/pfp/fish_red_man.jpg">
  <style>
    :root {
      --p: #0d0d0c;
      --i: #f0eeea;
      --m: #8b8781;
      --l: #2a2926;
      --a: #ff6b4a;
      --w: 31vw;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--p);
      color: var(--i);
      font: 15px/1.55 ui-monospace, monospace;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .hero {
      position: fixed;
      width: var(--w);
      inset: 0 auto 0 0;
      padding: 6vh 5vw;
      border-right: 1px solid var(--l);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #0d0d0cf5;
    }

    .name {
      font: clamp(3rem, 7vw, 8rem)/.86 Georgia, serif;
      letter-spacing: -.09em;
      margin: 0 0 1.3rem;
    }

    .name em {
      color: var(--a);
      font-style: normal;
    }

    .bio {
      max-width: 290px;
      color: #a5a19a;
    }

    .bio strong {
      color: var(--i);
      font-weight: 500;
    }

    .status {
      font-size: 11px;
      color: var(--m);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 1.7rem;
    }

    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--a);
      margin-right: 9px;
    }

    .socials {
      display: flex;
      flex-wrap: wrap;
      gap: 9px 15px;
    }

    .socials a {
      font-size: 11px;
      color: var(--m);
      border-bottom: 1px solid transparent;
    }

    .socials a:hover {
      color: var(--i);
      border-color: var(--i);
    }

    .content {
      margin-left: var(--w);
      padding: 6vh 8vw 12vh 7vw;
    }

    .intro {
      padding: 10vh 0 12vh;
    }

    .intro h2 {
      font: clamp(2rem, 4.4vw, 5rem)/.96 Georgia, serif;
      letter-spacing: -.07em;
      font-weight: 400;
      margin: 0 0 25px;
    }

    .intro h2 span {
      color: var(--m);
    }

    .intro p {
      max-width: 560px;
      color: var(--m);
      font-size: 14px;
    }

    .list {
      border-top: 1px solid var(--i);
    }

    .sig {
      display: grid;
      grid-template-columns: 1fr 120px 25px;
      gap: 18px;
      padding: 22px 0;
      border-bottom: 1px solid var(--l);
      transition: .2s;
    }

    .sig:hover {
      padding-left: 13px;
      background: #ffffff08;
    }

    .sig h3 {
      font: 500 17px/1.3 ui-monospace, monospace;
      letter-spacing: -.02em;
      margin: 0 0 8px;
    }

    .sig p {
      color: var(--m);
      font-size: 12px;
      margin: 0;
    }

    .arr {
      font-size: 18px;
    }

    @media (max-width: 800px) {
      :root {
        --w: 100%;
      }

      .hero {
        position: relative;
        width: 100%;
        min-height: 67vh;
        border: 0;
        border-bottom: 1px solid var(--l);
        padding: 9vw 7vw 8vw;
      }

      .content {
        margin: 0;
        padding: 8vw 7vw 16vw;
      }

      .intro {
        padding: 15vh 0 17vh;
      }

      .sig {
        grid-template-columns: 1fr 24px;
      }

      .sig .date {
        grid-column: 1;
      }

      .sig .arr {
        grid-column: 2;
        grid-row: 1/3;
      }
    }
  </style>
</head>
<body>
  <aside class="hero">
    <div>
      <h1 class="name">yuro<br><em>_</em></h1>
      <p class="bio">
        <strong>Inference Optimization</strong><br>
        RTX 2050 4GB
      </p>
    </div>
    <div>
      <div class="status">
        <span class="dot"></span>available for work
      </div>
      <nav class="socials">
        <a href="https://github.com/yuro-py">◌ github</a>
        <a href="https://x.com/yur_o_0">╳ x</a>
        <a href="https://linkedin.com/in/yuro-py">in linkedin</a>
        <a href="https://huggingface.co/yuro-py">◡ hf</a>
        <a href="mailto:yuroxebec@gmail.com">✉ email</a>
      </nav>
    </div>
  </aside>

  <main class="content">
    <div class="intro">
      <h2>An index of<br><span>things I have done</span></h2>
      <p>Projects, Implementations, notes, and experiments around inference, architecture etc</p>
    </div>
    <div class="list" id="list"></div>
  </main>

  <script>
    // ------------------------------------------------------------
    // work — every item below is tagged "work" via data-type.
    // Add your project / blog links here.
    // Replace the `link` value with the URL you want to redirect to.
    // Every item opens in a new tab.
    // ------------------------------------------------------------
    const SIGNALS = [
      {
        title: 'Speculative Decoding',
        date: '31-8-2026',
        desc: 'Demonstrating the impact of KV-Caching',
        link: 'https://github.com/yuro-py/speculative_decoding'
      },
      {
        title: 'Quantization',
        date: '27-8-2026',
        desc: 'Demonstrating the impact of KV-Caching',
        link: 'https://github.com/yuro-py/quantization'
      },
      {
        title: 'CUDA Basics',
        date: '23-8-2026',
        desc: 'Practicing a little CUDA with vector-add and matmuls',
        link: 'https://github.com/yuro-py/cuda_basics'
      },
      {
        title: 'DeepSeek Sparse Attention',
        date: '17-8-2026',
        desc: "Reproduction of V3.2's deepseek-sparse-attention in PyTorch",
        link: 'https://github.com/yuro-py/deepseek-sparse-attention'
      },
      {
        title: 'Multi-head Latent Attention',
        date: '01-8-2026',
        desc: "End-to-end implementation of DeepSeek-V2's MLA",
        link: 'https://github.com/yuro-py/deepseek-mla'
      },
      {
        title: 'KV-Cache on Self-Attn and MHA',
        date: '27-7-2026',
        desc: 'Demonstrating the impact of KV-Caching',
        link: 'https://github.com/yuro-py/KV-cache'
      },
      {
        title: 'Attention is all you need',
        date: '23-7-2026',
        desc: 'A from-scratch reproduction of the transformer architecture from 2017.',
        link: 'https://github.com/yuro-py/attention_is_all_you_need'
      }
    ];

    const list = document.querySelector('#list');

    list.innerHTML = SIGNALS.map(s => `
      <a class="sig" href="${s.link}" target="_blank" rel="noopener noreferrer" data-type="work">
        <div>
          <h3>${s.title}</h3>
          <p>${s.desc}</p>
        </div>
        <div class="date">${s.date}</div>
        <div class="arr">↗</div>
      </a>
    `).join('');
  </script>
</body>
</html>
