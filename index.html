<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>yuro</title>
  <link rel="icon" href="/home/rdx/Desktop/xtra/Wallpapers/pfp/fish_red_man.jpg">
  <style>
    :root {
      --p: #0d0d0c;
      --i: #f0eeea;
      --m: #8b8781;
      --l: #2a2926;
      --a: #ff6b4a;
      --w: 31vw;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--p);
      color: var(--i);
      font: 15px/1.55 ui-monospace, monospace;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .hero {
      position: fixed;
      width: var(--w);
      inset: 0 auto 0 0;
      padding: 6vh 5vw;
      border-right: 1px solid var(--l);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #0d0d0cf5;
    }

    .name {
      font: clamp(3rem, 7vw, 8rem)/.86 Georgia, serif;
      letter-spacing: -.09em;
      margin: 0 0 1.3rem;
    }

    .name em {
      color: var(--a);
      font-style: normal;
    }

    .bio {
      max-width: 290px;
      color: #a5a19a;
    }

    .bio strong {
      color: var(--i);
      font-weight: 500;
    }

    .status {
      font: 500 12px/1.4 ui-monospace, monospace;
      color: var(--m);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 1.7rem;
    }

    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--a);
      margin-right: 9px;
    }

    .socials {
      display: flex;
      flex-wrap: wrap;
      gap: 9px 15px;
    }

    .socials a {
      font-size: 13px;
      color: var(--m);
      border-bottom: 1px solid transparent;
    }

    .socials a:hover {
      color: var(--i);
      border-color: var(--i);
    }

    .content {
      margin-left: var(--w);
      padding: 6vh 8vw 12vh 7vw;
    }

    .intro {
      padding: 10vh 0 12vh;
    }

    .intro h2 {
      font: clamp(2rem, 4.4vw, 5rem)/.96 Georgia, serif;
      letter-spacing: -.07em;
      font-weight: 400;
      margin: 0 0 25px;
    }

    .intro h2 span {
      color: var(--m);
    }

    .intro p {
      max-width: 560px;
      color: var(--m);
      font-size: 14px;
    }

    .list {
      border-top: 1px solid var(--i);
    }

    .sig {
      display: grid;
      grid-template-columns: 1fr 120px 25px;
      gap: 18px;
      padding: 22px 0;
      border-bottom: 1px solid var(--l);
      transition: .2s;
    }

    .sig:hover {
      padding-left: 13px;
      background: #ffffff08;
    }

    .sig h3 {
      font: 500 17px/1.3 ui-monospace, monospace;
      letter-spacing: -.02em;
      margin: 0 0 8px;
    }

    .sig p {
      color: var(--m);
      font-size: 12px;
      margin: 0;
    }

    .arr {
      font-size: 18px;
    }

    /* ---------- blog reader ---------- */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #0d0d0ceb;
      backdrop-filter: blur(4px);
      overflow-y: auto;
      display: none;
    }

    .overlay.open {
      display: block;
    }

    .reader {
      position: relative;
      max-width: 760px;
      margin: 8vh auto;
      padding: 5vh 6vw;
      background: var(--p);
      border: 1px solid var(--l);
    }

    .reader-close {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      border: 1px solid var(--l);
      color: var(--m);
      font: inherit;
      font-size: 12px;
      padding: 4px 10px;
      cursor: pointer;
    }

    .reader-close:hover {
      color: var(--a);
      border-color: var(--a);
    }

    .reader-meta {
      color: var(--m);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .reader h1 {
      font: clamp(1.8rem, 4vw, 3rem)/1.05 Georgia, serif;
      letter-spacing: -.04em;
      font-weight: 400;
      margin: .5rem 0 2rem;
    }

    .prose {
      color: #cfccc6;
    }

    .prose h1, .prose h2, .prose h3 {
      color: var(--i);
      font-family: Georgia, serif;
      font-weight: 400;
      letter-spacing: -.02em;
      margin: 1.8em 0 .6em;
    }

    .prose p, .prose ul, .prose ol, .prose blockquote, .prose pre, .prose table {
      margin: 0 0 1.1em;
    }

    .prose a {
      color: var(--a);
      border-bottom: 1px solid var(--a);
    }

    .prose code {
      background: var(--l);
      padding: 1px 5px;
      font-size: 13px;
    }

    .prose pre {
      background: var(--l);
      padding: 14px;
      overflow-x: auto;
    }

    .prose pre code {
      background: none;
      padding: 0;
    }

    .prose blockquote {
      border-left: 2px solid var(--a);
      margin-left: 0;
      padding-left: 14px;
      color: var(--m);
    }

    .prose img {
      max-width: 100%;
    }

    .prose table {
      border-collapse: collapse;
      display: block;
      overflow-x: auto;
    }

    .prose th, .prose td {
      border: 1px solid var(--l);
      padding: 6px 10px;
      text-align: left;
    }

    @media (max-width: 800px) {
      :root {
        --w: 100%;
      }

      .hero {
        position: relative;
        width: 100%;
        min-height: 67vh;
        border: 0;
        border-bottom: 1px solid var(--l);
        padding: 9vw 7vw 8vw;
      }

      .content {
        margin: 0;
        padding: 8vw 7vw 16vw;
      }

      .intro {
        padding: 15vh 0 17vh;
      }

      .sig {
        grid-template-columns: 1fr 24px;
      }

      .sig .date {
        grid-column: 1;
      }

      .sig .arr {
        grid-column: 2;
        grid-row: 1/3;
      }

      .reader {
        margin: 4vh auto;
        padding: 8vh 6vw 6vh;
      }
    }
  </style>
</head>
<body>
  <aside class="hero">
    <div>
      <h1 class="name">yuro<br><em>_</em></h1>
      <p class="bio">
        <strong>Inference Optimization</strong><br>
        RTX 2050 4GB
      </p>
    </div>
    <div>
      <div class="status">
        <span class="dot"></span>available for work
      </div>
      <nav class="socials">
        <a href="https://github.com/yuro-py" target="_blank">⌘ github</a>
        <a href="https://x.com/yur_o_0" target="_blank">𝕏 x</a>
        <a href="https://linkedin.com/in/yuro0" target="_blank">in linkedin</a>
        <a href="https://huggingface.co/yuro-py" target="_blank">♙ hf</a>
        <a href="mailto:yuroxebec@gmail.com" target="_blank">✉ email</a>
      </nav>
    </div>
  </aside>

  <main class="content">
    <div class="intro">
      <h2>An index of<br><span>things I have done</span></h2>
      <p>Projects, Implementations, notes, and experiments around inference, architecture etc</p>
    </div>
    <div class="list" id="list"></div>
  </main>

  <!-- blog reader -->
  <div class="overlay" id="overlay" aria-hidden="true">
    <article class="reader" role="dialog" aria-modal="true" aria-labelledby="reader-title">
      <button class="reader-close" id="reader-close" aria-label="Close">esc ✕</button>
      <div class="reader-meta" id="reader-meta"></div>
      <h1 id="reader-title"></h1>
      <div class="prose" id="reader-body"></div>
    </article>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

  <script>
    // ------------------------------------------------------------
    // EXTERNAL — projects that link out. Shown with an arrow.
    // ------------------------------------------------------------
    const EXTERNAL = [
      {
        title: 'Paged Attention',
        date: '23-9-2026',
        desc: 'vLLM\'s Paged Attention, implemented in PyTorch',
        link: 'https://github.com/yuro-py/paged_attention'
      },
      {
        title: 'Speculative Decoding',
        date: '31-8-2026',
        desc: 'Experimenting with speculative decoding with a dummy draft model and target model on sample sequences',
        link: 'https://github.com/yuro-py/speculative_decoding'
      },
      {
        title: 'Quantization',
        date: '27-8-2026',
        desc: 'asymmetric/symmetric quantization, range selection, granularity, PTQ',
        link: 'https://github.com/yuro-py/quantization'
      },
      {
        title: 'CUDA Basics',
        date: '23-8-2026',
        desc: 'Practicing CUDA with vector-add and matmuls',
        link: 'https://github.com/yuro-py/cuda_basics'
      },
      {
        title: 'DeepSeek Sparse Attention',
        date: '17-8-2026',
        desc: "Reproduction of V3.2's deepseek-sparse-attention in PyTorch",
        link: 'https://github.com/yuro-py/deepseek-sparse-attention'
      },
      {
        title: 'Multi-head Latent Attention',
        date: '01-8-2026',
        desc: "Implementation of 'Low-rank key-value joint-compression'",
        link: 'https://github.com/yuro-py/deepseek-mla'
      },
      {
        title: 'KV-Cache on MHA',
        date: '27-7-2026',
        desc: 'Demonstrating the impact of KV-Caching',
        link: 'https://github.com/yuro-py/KV-cache'
      },
      {
        title: 'Attention is all you need',
        date: '23-7-2026',
        desc: 'A from-scratch reproduction of the transformer architecture from 2017.',
        link: 'https://github.com/yuro-py/attention_is_all_you_need'
      },
      {
        title: 'Backpropagation SUPEREASY',
        date: '06-4-2026',
        desc: 'Backpropagation for PyTorch beginners',
        link: 'https://raw.githubusercontent.com/yuro-py/yuro-py.github.io/refs/heads/main/first_blogs/06_april_backpropagation_for_beginners.md'
      },
      {
        title: 'Residual Connection in TRM. Why?',
        date: '05-4-2026',
        desc: 'I learnt about residual connection from TRM so wrote why is it needed here',
        link: 'https://raw.githubusercontent.com/yuro-py/yuro-py.github.io/refs/heads/main/first_blogs/05_april_residual_connection_in_trm.md'
      },
      {
        title: 'PyTorch and Neural Networks',
        date: '04-4-2026',
        desc: 'Writing a house-price prediction model in pytorch with neural nets',
        link: 'https://raw.githubusercontent.com/yuro-py/yuro-py.github.io/refs/heads/main/first_blogs/04_april_pytorch_and_neural_networks.md'
      },
      {
        title: 'Tiny Recursive Model',
        date: '28-3-2026',
        desc: 'Wrote my first mini blog on TRM, 2 layer network for recursive reasoning and solving grid-based tasks',
        link: 'https://raw.githubusercontent.com/yuro-py/yuro-py.github.io/refs/heads/main/first_blogs/28_march_tiny_recursive_model.md'
      },
    ];

    // ------------------------------------------------------------
    // BLOGS — markdown files inside ./blogs/
    //
    // Each file looks like:
    //   ---
    //   title: My Post
    //   date: 2026-10-20
    //   description: One line summary
    //   ---
    //   # Body in markdown...
    //
    // The page finds them by reading the blogs/ directory listing.
    // If your host doesn't show directory listings (e.g. GitHub Pages),
    // list the filenames in blogs/manifest.json instead: ["my-post.md", ...]
    // ------------------------------------------------------------
    const BLOG_DIR = 'blogs/';
    const MANIFEST = 'blogs/manifest.json';

    const list = document.querySelector('#list');
    const overlay = document.querySelector('#overlay');
    const readerTitle = document.querySelector('#reader-title');
    const readerMeta = document.querySelector('#reader-meta');
    const readerBody = document.querySelector('#reader-body');
    const readerClose = document.querySelector('#reader-close');

    let blogs = [];

    // ---------- helpers ----------
    const esc = s => String(s ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

    // Sortable time from "2026-10-20", "20-10-2026" or anything Date can parse
    function toTime(d) {
      if (!d) return 0;
      let m = d.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if (m) return Date.UTC(+m[1], +m[2] - 1, +m[3]);
      m = d.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);
      if (m) return Date.UTC(+m[3], +m[2] - 1, +m[1]);
      const t = Date.parse(d);
      return isNaN(t) ? 0 : t;
    }

    function parseFrontmatter(text) {
      const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
      const meta = {};
      if (!m) return { meta, body: text };
      m[1].split(/\r?\n/).forEach(line => {
        const i = line.indexOf(':');
        if (i > 0) {
          meta[line.slice(0, i).trim()] = line.slice(i + 1).trim().replace(/^["']|["']$/g, '');
        }
      });
      return { meta, body: text.slice(m[0].length) };
    }

    // ---------- discovery ----------
    async function listBlogFiles() {
      // 1) directory listing (python -m http.server, nginx autoindex, etc.)
      try {
        const res = await fetch(BLOG_DIR, { cache: 'no-store' });
        if (res.ok) {
          const html = await res.text();
          const doc = new DOMParser().parseFromString(html, 'text/html');
          const names = [...doc.querySelectorAll('a')]
            .map(a => a.getAttribute('href') || '')
            .filter(h => /\.md$/i.test(h) && !h.includes('/'))
            .map(h => decodeURIComponent(h));
          if (names.length) return [...new Set(names)];
        }
      } catch (_) {}

      // 2) manifest fallback
      try {
        const res = await fetch(MANIFEST, { cache: 'no-store' });
        if (res.ok) {
          const names = await res.json();
          return names.filter(n => /\.md$/i.test(n));
        }
      } catch (_) {}

      return [];
    }

    async function loadBlog(file) {
      const res = await fetch(BLOG_DIR + encodeURIComponent(file), { cache: 'no-store' });
      if (!res.ok) throw new Error(`${file}: ${res.status}`);
      const { meta, body } = parseFrontmatter(await res.text());
      const slug = file.replace(/\.md$/i, '');
      return {
        type: 'blog',
        slug,
        title: meta.title || slug.replace(/[-_]+/g, ' '),
        date: meta.date || '',
        desc: meta.description || '',
        body
      };
    }

    async function loadBlogs() {
      const files = await listBlogFiles();
      const results = await Promise.allSettled(files.map(loadBlog));
      results.forEach(r => {
        if (r.status === 'rejected') console.warn('Blog skipped:', r.reason);
      });
      return results.filter(r => r.status === 'fulfilled').map(r => r.value);
    }

    // ---------- rendering ----------
    function renderList() {
      const items = [...EXTERNAL.map(e => ({ ...e, type: 'external' })), ...blogs]
        .sort((a, b) => toTime(b.date) - toTime(a.date));

      list.innerHTML = items.map(s => {
        const isBlog = s.type === 'blog';
        const href = isBlog ? `#blog/${encodeURIComponent(s.slug)}` : s.link;
        const target = isBlog ? '' : ' target="_blank" rel="noopener noreferrer"';
        return `
          <a class="sig" href="${esc(href)}"${target} data-type="${s.type}">
            <div>
              <h3>${esc(s.title)}</h3>
              <p>${esc(s.desc)}</p>
            </div>
            <div class="date">${esc(s.date)}</div>
            <div class="arr">${isBlog ? '' : '↗'}</div>
          </a>`;
      }).join('');
    }

    // ---------- reader ----------
    function openBlog(slug) {
      const b = blogs.find(x => x.slug === slug);
      if (!b) return;
      readerMeta.textContent = b.date;
      readerTitle.textContent = b.title;
      readerBody.innerHTML = DOMPurify.sanitize(marked.parse(b.body));
      overlay.classList.add('open');
      overlay.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      overlay.scrollTop = 0;
      readerClose.focus();
    }

    function closeBlog() {
      if (!overlay.classList.contains('open')) return;
      overlay.classList.remove('open');
      overlay.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    function route() {
      const m = location.hash.match(/^#blog\/(.+)$/);
      if (m) openBlog(decodeURIComponent(m[1]));
      else closeBlog();
    }

    readerClose.addEventListener('click', () => { location.hash = ''; });
    overlay.addEventListener('click', e => { if (e.target === overlay) location.hash = ''; });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') location.hash = ''; });
    window.addEventListener('hashchange', route);

    // ---------- boot ----------
    renderList(); // external items show immediately
    loadBlogs().then(found => {
      blogs = found;
      renderList();
      route();
    });
  </script>
</body>
</html>
