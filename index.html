<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <style>
    :root {
      --p: #0d0d0c;
      --i: #f0eeea;
      --m: #8b8781;
      --l: #2a2926;
      --a: #ff6b4a;
      --w: 31vw;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--p);
      color: var(--i);
      font: 15px/1.55 ui-monospace, monospace;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .hero {
      position: fixed;
      width: var(--w);
      inset: 0 auto 0 0;
      padding: 6vh 5vw;
      border-right: 1px solid var(--l);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #0d0d0cf5;
    }

    .name {
      font: clamp(3rem, 7vw, 8rem)/.86 Georgia, serif;
      letter-spacing: -.09em;
      margin: 0 0 1.3rem;
    }

    .name em {
      color: var(--a);
      font-style: normal;
    }

    .bio {
      max-width: 290px;
      color: #a5a19a;
    }

    .bio strong {
      color: var(--i);
      font-weight: 500;
    }

    .status {
      font: 500 12px/1.4 ui-monospace, monospace;
      color: var(--m);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 1.7rem;
    }

    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--a);
      margin-right: 9px;
    }

    .socials {
      display: flex;
      flex-wrap: wrap;
      gap: 9px 15px;
    }

    .socials a {
      font-size: 13px;
      color: var(--m);
      border-bottom: 1px solid transparent;
    }

    .socials a:hover {
      color: var(--i);
      border-color: var(--i);
    }

    .content {
      margin-left: var(--w);
      padding: 6vh 8vw 12vh 7vw;
    }

    .intro {
      padding: 10vh 0 12vh;
    }

    .intro h2 {
      font: clamp(2rem, 4.4vw, 5rem)/.96 Georgia, serif;
      letter-spacing: -.07em;
      font-weight: 400;
      margin: 0 0 25px;
    }

    .intro h2 span {
      color: var(--m);
    }

    .intro p {
      max-width: 560px;
      color: var(--m);
      font-size: 14px;
    }

    .list {
      border-top: 1px solid var(--i);
    }

    .sig {
      display: grid;
      grid-template-columns: 1fr 120px 25px;
      gap: 18px;
      padding: 22px 0;
      border-bottom: 1px solid var(--l);
      transition: .2s;
    }

    .sig:hover {
      padding-left: 13px;
      background: #ffffff08;
    }

    .sig h3 {
      font: 500 17px/1.3 ui-monospace, monospace;
      letter-spacing: -.02em;
      margin: 0 0 8px;
    }

    .sig p {
      color: var(--m);
      font-size: 12px;
      margin: 0;
    }

    .arr {
      font-size: 18px;
    }

    /* ---------- blog reader ---------- */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: var(--p);
      overflow-y: auto;
      display: none;
    }

    .overlay.open {
      display: block;
    }

    .reader {
      position: relative;
      width: 75vw;
      min-height: 100vh;
      margin: 0 auto;
      padding: 5vh 7vw 10vh;
      background: var(--p);
      border-left: 1px solid var(--l);
      border-right: 1px solid var(--l);
    }

    .reader-close {
      display: inline-flex;
      align-items: center;
      margin: 0 0 2.5rem;
      background: #ffffff05;
      border: 1px solid var(--l);
      color: var(--i);
      font: inherit;
      font-size: 15px;
      padding: 12px 18px;
      cursor: pointer;
      transition: color .15s, border-color .15s, background .15s;
    }

    .reader-close:hover {
      color: var(--a);
      border-color: var(--a);
      animation: back-blink .7s steps(1, end) infinite;
    }

    .reader-close:focus-visible {
      outline: 2px solid var(--a);
      outline-offset: 3px;
    }

    @keyframes back-blink {
      50% { opacity: .38; background: #ff6b4a18; }
    }

    @media (prefers-reduced-motion: reduce) {
      .reader-close:hover { animation: none; }
    }

    .reader-meta {
      color: var(--m);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .reader h1 {
      font: clamp(1.8rem, 4vw, 3rem)/1.05 Georgia, serif;
      letter-spacing: -.04em;
      font-weight: 400;
      margin: .5rem 0 2rem;
    }

    .prose {
      color: #cfccc6;
    }

    .prose h1, .prose h2, .prose h3 {
      color: var(--i);
      font-family: Georgia, serif;
      font-weight: 400;
      letter-spacing: -.02em;
      margin: 1.8em 0 .6em;
    }

    .prose p, .prose ul, .prose ol, .prose blockquote, .prose pre, .prose table {
      margin: 0 0 1.1em;
    }

    .prose a {
      color: var(--a);
      border-bottom: 1px solid var(--a);
    }

    .prose code {
      background: var(--l);
      padding: 1px 5px;
      font-size: 13px;
    }

    .prose pre {
      background: var(--l);
      padding: 14px;
      overflow-x: auto;
    }

    .prose pre code {
      background: none;
      padding: 0;
    }

    .prose blockquote {
      border-left: 2px solid var(--a);
      margin-left: 0;
      padding-left: 14px;
      color: var(--m);
    }

    .prose img {
      max-width: 100%;
    }

    .prose table {
      border-collapse: collapse;
      display: block;
      overflow-x: auto;
    }

    .prose th, .prose td {
      border: 1px solid var(--l);
      padding: 6px 10px;
      text-align: left;
    }

    @media (max-width: 800px) {
      :root {
        --w: 100%;
      }

      .hero {
        position: relative;
        width: 100%;
        min-height: 67vh;
        border: 0;
        border-bottom: 1px solid var(--l);
        padding: 9vw 7vw 8vw;
      }

      .content {
        margin: 0;
        padding: 8vw 7vw 16vw;
      }

      .intro {
        padding: 15vh 0 17vh;
      }

      .sig {
        grid-template-columns: 1fr 24px;
      }

      .sig .date {
        grid-column: 1;
      }

      .sig .arr {
        grid-column: 2;
        grid-row: 1/3;
      }

      .reader {
        width: 100%;
        min-height: 100vh;
        margin: 0;
        padding: 7vh 7vw 10vh;
        border: 0;
      }

      .reader-close { margin-bottom: 2rem; }
    }
  </style>

  <script>
    // Add a URL or Markdown filename here for every new portfolio item.
    const CATALOG = [
      {
        title: 'Inference Gateway',
        date: '28-10-2026',
        desc: 'Model-independent gateway pipeline for vllm inference engine',
        link: 'https://github.com/yuro-py/inference-gateway'
      },
      {
        file: 'serving-agentic-workload-on-rtx-5090-with-qwen3-8-27B.md',
        title: 'Agentic Workload on a single RTX 5090 with Qwen3.8-27B : a read',
        date: '30-10-2026',
        desc: 'Bottlenecks, resolutions and boosting throughput while maintaining overall average latency',
        // Generated from the Markdown file so the post still works if its asset is absent.
        body: "Chatbots do merely request/response.\nAgentic workloads do a lot of thinking, acting, observing and looping.\n\nThere are problems in agents which chatbot-focused inference optimizations wont solve.\n\n## 1. AGENTIC BOTTLENECK\n\nAgent booking a flight is not \"request/response\", it a loop:\n\n1. think : \"I need to search for flights\" (generates tokens).\n2. act : \"calls a search api\" (gpu is idle waiting for network).\n3. observe : reads the json result (huge input tokens added to context window).\n4. think : \"ok I pick the easiest one\" (generates tokens again).\n\nAgents adds massive context (scraped web page or api logs) which raises two issues:\n\n- **prefill spikes** -> it has to process that huge observation after acting, which takes a lot of compute and stalls other requests.\n- **kv cache explosion** -> every newly generated token has to be stored in immediate vram in kv pairs. 10 concurrent agents doing this will fill up vram fast, forcing \"premptionmode.recompute\" or slowing everything down.\n\n### MEMORY BANDWIDTH\n\nMEMORY BANDWIDTH is the first biggest wall which agentic workload faces cuz of massive kv cache.\n\n> 50 concurrent users X 8k context = 400K tokens = ~16gb allocated even before the weights have been loaded.\n\n## 2. NVFP4 on BLACKWELL\n\nRTX 5090 with NVFP4 solves memory bandwidth overload on agentic workloads.\n5090 uses blackwell architecture and supports NVFP4 which is different than standard FP4 or INT4.\n\n1. NVFP4 keeps the floating point structure but shrinks it to 4-bits.\n2. Storing kvc in nvfp4 compresses the vram required for concurrent user's contexts while still maintaining precision for complex reasoning even in 4 bits.\n3. It boosts throughput by releasing pressure on vram.\n\n## 3. PRODUCTION ARCHITECTURE to serve agents in 5090\n\n1. **prefix_caching** is non-negotiable as agentic workload incorporates a lot of reusable static tokens.\n2. **chunked_prefill** for overall latency -> receiving a massive observation for 1 user and processing it means other users get blocked.\n\n   So chunked prefill breaks the prefill into chunks and interleaves it with other request's decoding steps.\n\n   This way everyone's TTFT is slower but not paused, even one one agent is processing one user's massive load.\n3. **nvfp4 quantization** for efficient vram usage without disturbing complex reasoning work.\n\n## SERVING on an RTX 5090\n\n```bash\nvllm serve Qwen/Qwen3.8-27B \\\n    --quantization nvfp4 \\\n    --dtype bfloat16 \\\n    --enable-prefix-caching \\\n    --enable-chunked-prefill \\\n    --max-model-len 32768 \\\n    --gpu-memory-utilization 0.9 \\\n    --max-num-seqs 256 \\\n    --tensor-parallel-size 1\n```\n\nWith speculative decoding:\n\n```bash\n    --speculative-model Qwen/Qwen3-0.6B \\\n    --num-speculative-tokens 5 \\\n    --speculative-dtype bfloat16\n```\n"
      },

      {

        date: '23-7-2026',

        link: 'https://github.com/yuro-py/attention_is_all_you_need'
      },
      {
        title: 'Backpropagation SUPEREASY',
        date: '06-4-2026',
        desc: 'Backpropagation for PyTorch beginners',
        link: 'https://raw.githubusercontent.com/yuro-py/yuro-py.github.io/refs/heads/main/first_blogs/06_april_backpropagation_for_beginners.md'
      },
      {
        title: 'Residual Connection in TRM. Why?',
        date: '05-4-2026',
        desc: 'I learnt about residual connection from TRM so wrote why is it needed here',
        link: 'https://raw.githubusercontent.com/yuro-py/yuro-py.github.io/refs/heads/main/first_blogs/05_april_residual_connection_in_trm.md'
      },
      {
        title: 'PyTorch and Neural Networks',
        date: '04-4-2026',
        desc: 'Writing a house-price prediction model in pytorch with neural nets',
        link: 'https://raw.githubusercontent.com/yuro-py/yuro-py.github.io/refs/heads/main/first_blogs/04_april_pytorch_and_neural_networks.md'
      },
      {
        title: 'Tiny Recursive Model',
        date: '28-3-2026',
        desc: 'Wrote my first mini blog on TRM, 2 layer network for recursive reasoning and solving grid-based tasks',
        link: 'https://raw.githubusercontent.com/yuro-py/yuro-py.github.io/refs/heads/main/first_blogs/28_march_tiny_recursive_model.md'
      }
    ];

    // Resolve assets relative to this document so project pages and custom domains
    // both load Markdown files from the right directory.
    const BLOG_DIR = new URL('blogs/', document.baseURI);

    const list = document.querySelector('#list');
    const overlay = document.querySelector('#overlay');
    const readerTitle = document.querySelector('#reader-title');
    const readerMeta = document.querySelector('#reader-meta');
    const readerBody = document.querySelector('#reader-body');
    const readerClose = document.querySelector('#reader-close');

    let blogs = [];
    let blogFiles = [];
    let external = [];
    let localBlogDirectory = null;

    // ---------- helpers ----------
    const esc = s => String(s ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

    // Sort dates in the catalog's day-month-year format.
    function toTime(d) {
      if (!d) return 0;
      const m = d.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);
      return m ? Date.UTC(+m[3], +m[2] - 1, +m[1]) : 0;
    }

    function parseFrontmatter(text) {
      const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
      const meta = {};
      if (!m) return { meta, body: text };
      m[1].split(/\r?\n/).forEach(line => {
        const i = line.indexOf(':');
        if (i > 0) {
          meta[line.slice(0, i).trim()] = line.slice(i + 1).trim().replace(/^["']|["']$/g, '');
        }
      });
      return { meta, body: text.slice(m[0].length) };
    }

    function blogSlug(file) {
      return file.replace(/^blogs\//i, '').replace(/\.md$/i, '');
    }

    function blogStub(file) {
      const slug = blogSlug(file);
      const details = CATALOG.find(entry => entry && typeof entry === 'object' &&
        (entry.file || entry.blog) && (entry.file || entry.blog).replace(/^blogs\//i, '') === file.replace(/^blogs\//i, '')) || {};
      return {
        type: 'blog',
        slug,
        file: file.replace(/^blogs\//i, ''),
        title: details.title || slug.replace(/[-_]+/g, ' ').replace(/\b\w/g, char => char.toUpperCase()),
        date: details.date || '',
        desc: details.desc || details.description || '',
        body: typeof details.body === 'string' ? details.body : '',
        loaded: typeof details.body === 'string'
      };
    }

    function parseBlog(file, text) {
      const { meta, body } = parseFrontmatter(text);
      const slug = blogSlug(file);
      return {
        type: 'blog',
        slug,
        file: file.replace(/^blogs\//i, ''),
        title: meta.title || slug.replace(/[-_]+/g, ' '),
        date: meta.date || '',
        desc: meta.description || '',
        body,
        loaded: true
      };
    }

    async function loadLocalBlog(file) {
      if (!localBlogDirectory) throw new Error('No saved local blog access is available.');
      let permission = await localBlogDirectory.queryPermission({ mode: 'read' });
      if (permission !== 'granted' && localBlogDirectory.requestPermission) {
        permission = await localBlogDirectory.requestPermission({ mode: 'read' });
      }
      if (permission !== 'granted') throw new Error('The browser needs permission to read the blogs folder.');
      const handle = await localBlogDirectory.getFileHandle(file.replace(/^blogs\//i, ''));
      return (await handle.getFile()).text();
    }

    async function loadBlog(file) {
      file = file.replace(/^blogs\//i, '');
      if (!/^[^/\\]+\.md$/i.test(file)) throw new Error(`Invalid blog filename: ${file}`);
      let text;
      if (location.protocol === 'file:') {
        text = await loadLocalBlog(file);
      } else {
        const res = await fetch(new URL(encodeURIComponent(file), BLOG_DIR), { cache: 'no-store' });
        if (!res.ok) throw new Error(`${file}: ${res.status}`);
        text = await res.text();
      }
      return parseBlog(file, text);
    }

    function externalTitle(href) {
      const url = new URL(href);
      const part = url.pathname.split('/').filter(Boolean).pop();
      const label = (part || url.hostname.replace(/^www\./, '')).replace(/\.git$/i, '');
      return label.replace(/[-_]+/g, ' ').replace(/\b\w/g, char => char.toUpperCase());
    }

    function makeExternal(href, details = {}) {
      if (typeof href !== 'string' || !href.trim()) return null;
      const value = href.trim();
      const withProtocol = /^https?:\/\//i.test(value) ? value : `https://${value}`;
      try {
        const url = new URL(withProtocol);
        if (!['http:', 'https:'].includes(url.protocol)) return null;
        return {
          type: 'external',
          link: url.href,
          title: details.title || externalTitle(url.href),
          date: details.date || '',
          desc: details.desc || details.description || ''
        };
      } catch (_) {
        return null;
      }
    }

    async function loadPortfolio() {
      const files = [];
      external = [];
      CATALOG.forEach(entry => {
        if (typeof entry === 'string') {
          const value = entry.trim();
          if (!/^https?:\/\//i.test(value) && /\.md$/i.test(value)) files.push(value);
          else {
            const link = makeExternal(value);
            if (link) external.push(link);
          }
          return;
        }

        if (!entry || typeof entry !== 'object') return;
        const file = entry.file || entry.blog;
        if (typeof file === 'string') files.push(file);
        else {
          const link = makeExternal(entry.link || entry.url, entry);
          if (link) external.push(link);
        }
      });

      blogFiles = [...new Set(files)];
      if (location.protocol === 'file:') {
        blogs = blogFiles.map(blogStub);
        await restoreLocalBlogDirectory();
        if (localBlogDirectory) await refreshLocalBlogs();
        return;
      }

      const results = await Promise.allSettled(blogFiles.map(loadBlog));
      results.forEach(r => {
        if (r.status === 'rejected') console.warn('Blog skipped:', r.reason);
      });
      const loadedBySlug = new Map(results
        .filter(r => r.status === 'fulfilled')
        .map(r => [r.value.slug, r.value]));
      blogs = blogFiles.map(file => loadedBySlug.get(blogSlug(file)) || blogStub(file));
    }

    function openHandleDatabase() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) return reject(new Error('IndexedDB unavailable'));
        const request = indexedDB.open('folio-blog-reader', 1);
        request.onupgradeneeded = () => request.result.createObjectStore('handles');
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function restoreLocalBlogDirectory() {
      try {
        const db = await openHandleDatabase();
        const handle = await new Promise((resolve, reject) => {
          const request = db.transaction('handles').objectStore('handles').get('blogs');
          request.onsuccess = () => resolve(request.result || null);
          request.onerror = () => reject(request.error);
        });
        db.close();
        localBlogDirectory = handle;
      } catch (_) {
        localBlogDirectory = null;
      }
    }

    async function refreshLocalBlogs() {
      const results = await Promise.allSettled(blogFiles.map(loadBlog));
      const loadedBySlug = new Map(results
        .filter(r => r.status === 'fulfilled')
        .map(r => [r.value.slug, r.value]));
      blogs = blogFiles.map(file => loadedBySlug.get(blogSlug(file)) || blogStub(file));
    }

    // ---------- rendering ----------
    function renderList() {
      const items = [...external, ...blogs]
        .sort((a, b) => toTime(b.date) - toTime(a.date));

      list.innerHTML = items.map(s => {
        const isBlog = s.type === 'blog';
        const href = isBlog ? `#blog/${encodeURIComponent(s.slug)}` : s.link;
        const target = isBlog ? '' : ' target="_blank" rel="noopener noreferrer"';
        return `
          <a class="sig" href="${esc(href)}"${target} data-type="${s.type}">
            <div>
              <h3>${esc(s.title)}</h3>
              <p>${esc(s.desc)}</p>
            </div>
            <div class="date">${esc(s.date)}</div>
            <div class="arr">${isBlog ? '' : '↗'}</div>
          </a>`;
      }).join('');
    }

    // ---------- reader ----------
    function showReader() {
      overlay.classList.add('open');
      overlay.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      overlay.scrollTop = 0;
      readerClose.focus();
    }

    function showLocalBlogError(blog) {
      readerMeta.textContent = blog.date;
      readerTitle.textContent = blog.title;
      readerBody.replaceChildren();

      const message = document.createElement('p');
      message.textContent = 'The browser has no saved read access to this local Markdown file. Open the portfolio through a local web server to read in-app blogs.';
      readerBody.append(message);

      const hint = document.createElement('p');
      hint.textContent = 'From the folio folder, run: python3 -m http.server 8000 — then open http://localhost:8000.';
      readerBody.append(hint);

      showReader();
    }

    // Small built-in Markdown renderer. The external marked/DOMPurify scripts are
    // optional enhancements; the blog remains readable when a CDN is unavailable.
    function renderMarkdown(source) {
      if (window.marked?.parse && window.DOMPurify?.sanitize) {
        return DOMPurify.sanitize(marked.parse(source, { gfm: true }));
      }

      const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[char]);
      const inline = value => escapeHtml(value)
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" rel="noopener noreferrer">$1</a>');

      const lines = source.replace(/\r/g, '').split('\n');
      const output = [];
      let paragraph = [], list = null, code = null;
      const flushParagraph = () => {
        if (paragraph.length) output.push(`<p>${inline(paragraph.join(' '))}</p>`);
        paragraph = [];
      };
      const flushList = () => {
        if (list) output.push(`<${list.type}>${list.items.map(item => `<li>${inline(item)}</li>`).join('')}</${list.type}>`);
        list = null;
      };
      for (const line of lines) {
        if (/^\s*```/.test(line)) {
          flushParagraph(); flushList();
          if (code !== null) { output.push(`<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`); code = null; }
          else code = [];
          continue;
        }
        if (code !== null) { code.push(line); continue; }
        if (!line.trim()) { flushParagraph(); flushList(); continue; }
        const heading = line.match(/^(#{1,6})\s+(.+)$/);
        if (heading) { flushParagraph(); flushList(); const level = heading[1].length; output.push(`<h${level}>${inline(heading[2])}</h${level}>`); continue; }
        const quote = line.match(/^>\s?(.*)$/);
        if (quote) { flushParagraph(); flushList(); output.push(`<blockquote><p>${inline(quote[1])}</p></blockquote>`); continue; }
        const item = line.match(/^\s*(?:[-+*]|\d+\.)\s+(.+)$/);
        if (item) {
          flushParagraph();
          const type = /^\s*\d+\./.test(line) ? 'ol' : 'ul';
          if (list && list.type !== type) flushList();
          if (!list) list = { type, items: [] };
          list.items.push(item[1]);
          continue;
        }
        flushList(); paragraph.push(line.trim());
      }
      flushParagraph(); flushList();
      if (code !== null) output.push(`<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`);
      return output.join('\n');
    }

    async function openBlog(slug) {
      const b = blogs.find(x => x.slug === slug);
      if (!b) return;
      if (location.protocol === 'file:' && !localBlogDirectory) await restoreLocalBlogDirectory();
      if (!b.loaded) {
        try {
          Object.assign(b, await loadBlog(b.file));
        } catch (error) {
          if (location.protocol === 'file:') {
            showLocalBlogError(b);
            return;
          }
          readerMeta.textContent = b.date;
          readerTitle.textContent = b.title;
          readerBody.textContent = `Could not load ${b.file}. Check that the file exists in blogs/.`;
          showReader();
          return;
        }
      }
      readerMeta.textContent = b.date;
      readerTitle.textContent = b.title;
      readerBody.innerHTML = renderMarkdown(b.body);
      showReader();
    }

    function closeBlog() {
      if (!overlay.classList.contains('open')) return;
      overlay.classList.remove('open');
      overlay.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    function route() {
      const m = location.hash.match(/^#blog\/(.+)$/);
      if (m) openBlog(decodeURIComponent(m[1]));
      else closeBlog();
    }

    list.addEventListener('click', event => {
      const link = event.target.closest('a[data-type="blog"]');
      if (!link || location.protocol !== 'file:' || !localBlogDirectory || !localBlogDirectory.requestPermission) return;
      const targetSlug = decodeURIComponent((link.getAttribute('href') || '').replace(/^#blog\//, ''));
      const targetBlog = blogs.find(item => item.slug === targetSlug);
      if (!targetBlog || targetBlog.loaded) return;

      event.preventDefault();
      localBlogDirectory.requestPermission({ mode: 'read' }).then(async permission => {
        if (permission !== 'granted') throw new Error('Blog folder access was not granted.');
        await refreshLocalBlogs();
        renderList();
        if (location.hash === link.getAttribute('href')) await openBlog(targetBlog.slug);
        else location.hash = link.getAttribute('href');
      }).catch(() => showLocalBlogError(targetBlog));
    });

    readerClose.addEventListener('click', () => { location.hash = ''; });
    overlay.addEventListener('click', e => { if (e.target === overlay) location.hash = ''; });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') location.hash = ''; });
    window.addEventListener('hashchange', route);

    // ---------- boot ----------
    const portfolioReady = loadPortfolio();
    renderList();
    portfolioReady.then(() => {
      renderList();
      route();
    }).catch(error => {
      console.error('Could not load portfolio:', error);
      renderList();
    });
  </script>
</body>
</html>
